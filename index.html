<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0d0d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vídeos para Status — Portal Patriota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --verde:  #009C3B;
    --amarelo:#FFDF00;
    --azul:   #002776;
    --preto:  #0d0d0d;
    --cinza:  #999;
    --borda:  #d8d4cc;
    --bg:     #f5f4f0;
  }

  body {
    background: var(--bg);
    font-family: 'Cinzel', Georgia, serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
    -webkit-tap-highlight-color: transparent;
  }

  header { text-align: center; margin-bottom: 32px; }

  .flag-bar {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 18px;
  }
  .flag-bar span { display: block; height: 3px; border-radius: 2px; }
  .flag-bar .g { width: 40px; background: var(--verde); }
  .flag-bar .y { width: 64px; background: var(--amarelo); }
  .flag-bar .b { width: 28px; background: var(--azul); }

  h1 {
    font-size: clamp(1.1rem, 4vw, 1.7rem);
    font-weight: 900;
    color: var(--azul);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 0.65rem;
    color: var(--cinza);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .instruction {
    text-align: center;
    font-size: 0.85rem;
    color: #555;
    margin: 0 auto 28px;
    max-width: 460px;
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  /* ===== GRADE DE VÍDEOS ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    max-width: 980px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card:hover, .card:active {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,39,118,0.16);
  }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 9/16;
    background: linear-gradient(135deg, #002776 0%, #009C3B 60%, #FFDF00 100%);
    overflow: hidden;
  }
  .thumb video, .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .play-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 2.6rem;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    pointer-events: none;
    z-index: 2;
  }

  .card-info {
    padding: 8px 8px;
    text-align: center;
  }
  .card-title {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--azul);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.25;
  }

  /* ===== MODAL DO PLAYER =====
     Estratégia app-shell: quando o modal está aberto, travamos
     html/body em position:fixed com altura em px real.
     Todos os elementos internos usam flex-shrink:0 (o único
     "esticável" é o wrap do vídeo, mas com altura em px também).
  */
  body.modal-aberto,
  html.modal-aberto {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    overscroll-behavior: none;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.94);
    z-index: 999999;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .modal.open { display: flex; }

  .modal-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  .player-wrap {
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: block;
    flex-shrink: 0;
    margin: 0 auto;
  }
  .player-wrap video {
    display: block;
    background: #000;
  }

  .btn-baixar {
    width: 100%;
    max-width: 420px;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #fff;
    background: var(--verde);
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,156,59,0.45);
    transition: transform 0.12s, background 0.18s;
    flex-shrink: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn-baixar:hover  { background: #007a2e; }
  .btn-baixar:active { transform: scale(0.97); }
  .btn-baixar:disabled { opacity: 0.5; cursor: wait; }

  .btn-fechar {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 8px 22px;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn-fechar:hover { background: rgba(255,255,255,0.1); }

  .status-msg {
    color: #fff;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    min-height: 18px;
    text-align: center;
    flex-shrink: 0;
  }

  /* ===== ESTADOS ===== */
  .loading, .empty, .erro {
    text-align: center;
    color: var(--cinza);
    padding: 60px 20px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .loading::before {
    content: '⏳';
    display: block;
    font-size: 2rem;
    margin-bottom: 12px;
  }
  .erro { color: #b00; }
</style>
</head>
<body>

<header>
  <div class="flag-bar">
    <span class="g"></span><span class="y"></span><span class="b"></span>
    <span class="y"></span><span class="g"></span>
  </div>
  <h1>Vídeos para Status - 2026 já começou!</h1>
  <p class="tagline">Portal Patriota App</p>
</header>

<p class="instruction">
  Toque em qualquer vídeo abaixo para abrir.<br>
  Depois é só tocar no botão verde para baixar ou compartilhar no WhatsApp.
</p>

<div class="grid" id="grid">
  <div class="loading" style="grid-column: 1/-1;">Carregando vídeos…</div>
</div>

<!-- Modal do Player -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="player-wrap">
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <button class="btn-baixar" id="btnBaixar" onclick="baixarOuCompartilhar()">
      ⬇ Baixar / Compartilhar
    </button>
    <div class="status-msg" id="status"></div>
    <button class="btn-fechar" onclick="fecharModal()">✕ Fechar</button>
  </div>
</div>

<script>
// ========================================================
// CONFIGURAÇÃO — só edite aqui se mudar de repositório
// ========================================================
const GITHUB_USER = 'portalpatriota-app';
const GITHUB_REPO = 'videos-status';
const GITHUB_BRANCH = 'main';
const PASTA_VIDEOS = 'videos';
// ========================================================

const grid    = document.getElementById('grid');
const modal   = document.getElementById('modal');
const player  = document.getElementById('player');
const btnBaixar = document.getElementById('btnBaixar');
const status  = document.getElementById('status');
let videoAtual = null;
let listaVideos = [];

// Transforma "brasil-acima-de-tudo.mp4" em "Brasil Acima De Tudo"
function nomeBonito(nomeArquivo) {
  return nomeArquivo
    .replace(/\.(mp4|mov|webm|m4v)$/i, '')   // tira extensão
    .replace(/[-_]+/g, ' ')                   // troca - e _ por espaço
    .replace(/\s+/g, ' ')                     // normaliza espaços
    .trim()
    .split(' ')
    .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())
    .join(' ');
}

// Busca a lista de vídeos no GitHub
async function carregarVideos() {
  // Cache-bust: adiciona timestamp único a cada carregamento
  // para o WebView do app nunca servir uma versão antiga da lista.
  const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${PASTA_VIDEOS}?ref=${GITHUB_BRANCH}&_=${Date.now()}`;

  try {
    const resp = await fetch(apiUrl, { cache: 'no-store' });
    if (!resp.ok) {
      throw new Error(`API retornou ${resp.status}`);
    }
    const arquivos = await resp.json();

    // Filtra só vídeos
    listaVideos = arquivos
      .filter(a => a.type === 'file' && /\.(mp4|mov|webm|m4v)$/i.test(a.name))
      .map(a => ({
        titulo: nomeBonito(a.name),
        arquivo: a.download_url,
        nomeOriginal: a.name
      }))
      .sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));

    renderGrid();
  } catch (err) {
    grid.innerHTML = `
      <div class="erro" style="grid-column: 1/-1;">
        Não foi possível carregar os vídeos.<br>
        <small>Verifique se a pasta "${PASTA_VIDEOS}" existe no repositório.</small>
      </div>`;
    console.error(err);
  }
}

// Renderiza a grade
function renderGrid() {
  if (!listaVideos.length) {
    grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;">Nenhum vídeo disponível no momento.</div>';
    return;
  }
  grid.innerHTML = listaVideos.map((v, i) => `
    <div class="card" onclick="abrirVideo(${i})">
      <div class="thumb">
        <video data-src="${v.arquivo}" muted preload="none" playsinline webkit-playsinline disableRemotePlayback></video>
        <span class="play-icon">▶</span>
      </div>
      <div class="card-info">
        <div class="card-title">${v.titulo}</div>
      </div>
    </div>
  `).join('');

  // ═══ LAZY-LOAD DAS MINIATURAS ═══
  // WebViews de app nativo (Android WebView, Facebook, Instagram)
  // NÃO renderizam o frame de um <video> só com preload/seek.
  // A ÚNICA maneira confiável é chamar play() (que é permitido
  // porque o vídeo é muted+playsinline) e pausar em seguida.
  // Depois do play(), o frame fica desenhado mesmo após pause().
  function ativarMiniatura(v) {
    if (v.dataset.carregando === '1') return;
    v.dataset.carregando = '1';

    v.src = v.dataset.src + '#t=0.1';
    v.preload = 'auto';
    v.muted = true;              // obrigatório para autoplay em WebView
    v.defaultMuted = true;
    v.setAttribute('muted', ''); // reforço para iOS

    const capturarFrame = () => {
      try {
        v.currentTime = 0.1;
      } catch (_) {}

      const p = v.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          // Deixa pintar 1 ou 2 frames, aí pausa. O frame permanece.
          setTimeout(() => {
            try { v.pause(); } catch (_) {}
          }, 120);
        }).catch(() => {
          // Se autoplay foi bloqueado, ao menos tenta seek de novo
          try { v.currentTime = 0.1; } catch (_) {}
        });
      } else {
        setTimeout(() => { try { v.pause(); } catch (_) {} }, 120);
      }
    };

    v.addEventListener('loadeddata', capturarFrame, { once: true });
    v.addEventListener('canplay', capturarFrame, { once: true });

    v.load();
  }

  // Fila que só ativa 2 miniaturas por vez — assim o WebView não
  // trava tentando fazer 20 vídeos darem play() ao mesmo tempo.
  const fila = [];
  let ativos = 0;
  const MAX_ATIVOS = 2;
  function processarFila() {
    while (ativos < MAX_ATIVOS && fila.length) {
      const v = fila.shift();
      ativos++;
      const marcarPronto = () => {
        ativos = Math.max(0, ativos - 1);
        processarFila();
      };
      v.addEventListener('pause', marcarPronto, { once: true });
      v.addEventListener('error', marcarPronto, { once: true });
      setTimeout(marcarPronto, 3000); // timeout de segurança
      ativarMiniatura(v);
    }
  }

  const thumbs = grid.querySelectorAll('.thumb video[data-src]');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          fila.push(entry.target);
          io.unobserve(entry.target);
          processarFila();
        }
      });
    }, { rootMargin: '300px' });
    thumbs.forEach(v => io.observe(v));
  } else {
    thumbs.forEach(v => fila.push(v));
    processarFila();
  }
}

let scrollYSalvo = 0;
const playerWrap = document.querySelector('.player-wrap');

// ═══ ALTURA REAL DO WEBVIEW ═══
// Pega o MENOR valor entre 4 fontes possíveis de altura da tela.
// Nenhuma é confiável sozinha em WebView de app nativo, mas o
// menor sempre cabe na área realmente visível.
function alturaVisivelReal() {
  const candidatos = [];
  if (window.visualViewport && window.visualViewport.height) candidatos.push(window.visualViewport.height);
  if (window.innerHeight) candidatos.push(window.innerHeight);
  if (document.documentElement && document.documentElement.clientHeight) candidatos.push(document.documentElement.clientHeight);
  if (window.screen && window.screen.availHeight) candidatos.push(window.screen.availHeight);
  if (!candidatos.length) return 600;
  return Math.round(Math.min.apply(null, candidatos));
}
function larguraVisivelReal() {
  const candidatos = [];
  if (window.visualViewport && window.visualViewport.width) candidatos.push(window.visualViewport.width);
  if (window.innerWidth) candidatos.push(window.innerWidth);
  if (document.documentElement && document.documentElement.clientWidth) candidatos.push(document.documentElement.clientWidth);
  if (!candidatos.length) return 360;
  return Math.round(Math.min.apply(null, candidatos));
}

// ═══ TOUCHMOVE SELETIVO ═══
// Quando o modal está aberto, bloqueia scroll em tudo que não seja
// um elemento com scroll interno de verdade. Isso mata o "void branco"
// e o arrasto do documento por trás.
document.addEventListener('touchmove', function (e) {
  if (!modal.classList.contains('open')) return;
  let el = e.target;
  while (el && el !== document.body && el !== document.documentElement) {
    let s;
    try { s = getComputedStyle(el); } catch (_) { s = null; }
    if (s && (s.overflowY === 'auto' || s.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) {
      return; // deixa rolar dentro desse elemento
    }
    el = el.parentElement;
  }
  e.preventDefault();
}, { passive: false });

function dimensionarModal() {
  const h = alturaVisivelReal();
  const w = larguraVisivelReal();

  // Aplica altura em px em TODOS os containers relevantes ao mesmo
  // tempo. Se um WebView ignora um, outro pega.
  const px = h + 'px';
  document.documentElement.style.height = px;
  document.documentElement.style.maxHeight = px;
  document.body.style.height = px;
  document.body.style.maxHeight = px;

  modal.style.top = '0px';
  modal.style.left = '0px';
  modal.style.width = w + 'px';
  modal.style.height = px;
  modal.style.maxHeight = px;

  // Vídeo ocupa 50% da altura visível. Largura calculada por 9:16.
  // Aplicamos px direto no wrapper E no <video> — WebViews podem
  // ignorar restrições em pais, então forçamos os dois.
  const alturaMaxPlayer = Math.max(160, Math.floor(h * 0.50));
  const larguraMaxPlayer = Math.min(w - 24, Math.floor(alturaMaxPlayer * 9 / 16));

  playerWrap.style.height = alturaMaxPlayer + 'px';
  playerWrap.style.maxHeight = alturaMaxPlayer + 'px';
  playerWrap.style.width = larguraMaxPlayer + 'px';
  playerWrap.style.maxWidth = larguraMaxPlayer + 'px';

  player.style.height = alturaMaxPlayer + 'px';
  player.style.maxHeight = alturaMaxPlayer + 'px';
  player.style.width = larguraMaxPlayer + 'px';
  player.style.maxWidth = larguraMaxPlayer + 'px';
  player.style.objectFit = 'contain';
}
window.addEventListener('resize', () => {
  if (modal.classList.contains('open')) dimensionarModal();
});
window.addEventListener('orientationchange', () => {
  if (modal.classList.contains('open')) setTimeout(dimensionarModal, 400);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    if (modal.classList.contains('open')) dimensionarModal();
  });
}

function abrirVideo(idx) {
  videoAtual = listaVideos[idx];
  player.src = videoAtual.arquivo;
  status.textContent = '';

  scrollYSalvo = window.scrollY || window.pageYOffset || 0;

  // Trava o documento inteiro como um app-shell: html e body viram
  // position:fixed com overflow hidden. Estratégia idêntica ao
  // Debatedor IA — é o que faz o WebView parar de "vazar" espaço.
  document.documentElement.classList.add('modal-aberto');
  document.body.classList.add('modal-aberto');

  dimensionarModal();
  modal.classList.add('open');
  window.scrollTo(0, 0);
}

function fecharModal() {
  modal.classList.remove('open');
  player.pause();
  player.src = '';
  status.textContent = '';

  // Destrava o documento
  document.documentElement.classList.remove('modal-aberto');
  document.body.classList.remove('modal-aberto');
  document.documentElement.style.height = '';
  document.documentElement.style.maxHeight = '';
  document.body.style.height = '';
  document.body.style.maxHeight = '';

  window.scrollTo(0, scrollYSalvo);
}

// Fecha modal ao tocar fora
modal.addEventListener('click', (e) => {
  if (e.target === modal) fecharModal();
});

// ========================================================
// BAIXAR OU COMPARTILHAR
// ========================================================
async function baixarOuCompartilhar() {
  if (!videoAtual) return;

  const isMob = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const filename = videoAtual.nomeOriginal;

  btnBaixar.disabled = true;
  status.textContent = '⏳ Preparando vídeo…';

  try {
    const response = await fetch(videoAtual.arquivo);
    const blob = await response.blob();

    // Mobile: tenta share nativo
    if (isMob && navigator.canShare) {
      const file = new File([blob], filename, { type: 'video/mp4' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: videoAtual.titulo
          });
          status.textContent = '✦ Compartilhado!';
          btnBaixar.disabled = false;
          return;
        } catch (err) {
          if (err.name === 'AbortError') {
            status.textContent = '';
            btnBaixar.disabled = false;
            return;
          }
        }
      }
    }

    // Desktop ou fallback: download direto
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = '✦ Baixado!';

  } catch (err) {
    status.textContent = 'Erro: ' + err.message;
  }

  btnBaixar.disabled = false;
}

// Inicia
carregarVideos();
</script>
</body>
</html>
